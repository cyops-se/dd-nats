name: Build
run-name: Build
on:
  schedule:
    - cron: 0 4 * * *
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  build:
    name: Generate Build Artifacts
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        os: [windows, linux]
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set-up Node environment
        uses: actions/setup-node@v4
        with:
          # Vue CLI 4 / webpack 4 requires Node <= 16 (OpenSSL 3 incompatibility in later versions)
          node-version: '16'
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
        run: buildall.bat
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/${{ matrix.os }}
